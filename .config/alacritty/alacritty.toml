colors.draw_bold_text_with_bright_colors = true

[window]
opacity =0.85

[font]
size = 14.0

[font.normal]
family = "Hack Nerd Font"
style = "regular"

[font.bold]
family = "Hack Nerd Font"
style = "bold"

[font.italic]
family = "Hack Nerd Font"
style = "italic"

# Cursor shape values = block. beam. underline
[cursor.style]
shape = "beam"
blinking = "on"

